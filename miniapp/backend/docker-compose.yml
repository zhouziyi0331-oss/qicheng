version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/qicheng_opc
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - qicheng-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - qicheng-network

volumes:
  mongo-data:

networks:
  qicheng-network:
    driver: bridge
